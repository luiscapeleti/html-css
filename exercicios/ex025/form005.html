<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" id="masc" name="sexo" checked><label for="masc"> Masculino</label>
            <br>
            <input type="radio" id="fem" name="sexo"><label for="fem"> Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="fut" id="ifut"> <label for="ifut"> Futebol</label> <br>
            <input type="checkbox" name="basq" id="ibasq"> <label for="ibasq"> Basquete</label>
            <br>
            <input type="checkbox" name="vol" id="ivol"> Vôlei
            <br>
            <input type="checkbox" name="ten" id="iten"> Tênis
            <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
